spring.application.name=educmind-app

# ---------------------------------------------------------------------------
# Database (Spec v2: 1 database, Flyway quản lý schema V1..V7)
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/educmind}
spring.datasource.username=${DB_USER:educmind}
spring.datasource.password=${DB_PASSWORD:educmind_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------------
# Security / JWT  (BẮT BUỘC đặt JWT_SECRET ở production — xem README)
# ---------------------------------------------------------------------------
educmind.jwt.secret=${JWT_SECRET:dev-only-secret-0123456789abcdef0123456789abcdef-change-in-production}
educmind.jwt.access-token-ttl-minutes=${JWT_TTL_MINUTES:60}
educmind.security.password-min-length=8
educmind.password-reset.ttl-minutes=15
educmind.password-reset.link-base-url=${FRONT_URL:http://localhost:5173}/reset-password

# ---------------------------------------------------------------------------
# Mail (đặt MAIL_USERNAME / MAIL_PASSWORD; nếu trống, link đặt mật khẩu chỉ ghi log)
# ---------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------------------------------------------------------------------------
# Upload / storage
# ---------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=52MB
educmind.storage.local-base-path=${STORAGE_PATH:./storage/resources}

# ---------------------------------------------------------------------------
# Seed dữ liệu dev (US-T00, US-T01...): bật bằng EDUCMIND_SEED=true
# ---------------------------------------------------------------------------
educmind.seed.enabled=${EDUCMIND_SEED:false}
educmind.seed.teacher-email=teacher@educmind.vn
educmind.seed.teacher-password=Teacher@123
educmind.seed.student-password=Student@123
