spring.application.name=educmind-app

spring.datasource.url=jdbc:postgresql://localhost:5432/educmind
spring.datasource.username=educmind
spring.datasource.password=educmind_dev
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.data.redis.host=localhost
spring.data.redis.port=6379

educmind.jwt.secret=0f2c9890403a90970ab1efee4955af1548f29d0f267ed86420e300068607a546
educmind.jwt.access-token-ttl-minutes=15
educmind.jwt.refresh-token-ttl-days=7

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

educmind.password-reset.link-base-url=http://localhost:3000/reset-password

spring.servlet.multipart.max-file-size=55MB
spring.servlet.multipart.max-request-size=55MB

educmind.storage.local-base-path=./storage/resources

# Module 5 - Mastery (giá trị tạm [TBD], cần hiệu chỉnh bằng dữ liệu thực tế)
educmind.analytics.mastery.half-life-days=30
educmind.analytics.mastery.confidence-medium-min-evidence=3
educmind.analytics.mastery.confidence-high-min-evidence=5

# Module 5 - Knowledge gap (giá trị tạm [TBD], cần hiệu chỉnh bằng dữ liệu thực tế)
educmind.analytics.gap.open-threshold=0.50
educmind.analytics.gap.resolve-threshold=0.65
