services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: educmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: educmind
      POSTGRES_USER: educmind
      POSTGRES_PASSWORD: educmind_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: educmind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
